name: Firmware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      # Board and USB settings come from firmware/dongle/sketch.yaml.
      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls "$CORE_URL"
          arduino-cli core install esp32:esp32 --additional-urls "$CORE_URL"
        env:
          CORE_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile dongle firmware
        run: arduino-cli compile firmware/dongle
